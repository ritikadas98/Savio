      name="description"
      content="An AI companion for the one question budget apps never answer: can I afford this, right now? It reasons over your real income, commitments and goals."

    <!-- Link preview. Without these a shared link unfurls as the bare word
         "savio" over a hostname, which is what LinkedIn showed. The image is
         served from ritikadas.in because that is where the card is designed
         and versioned; scrapers fetch it cross-origin without complaint.
         Absolute URLs are required — scrapers do not resolve relative paths. -->
    <link rel="canonical" href="https://savio.ritikadas.in/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ritika Das" />
    <meta property="og:url" content="https://savio.ritikadas.in/" />
    <meta property="og:title" content="Savio" />
    <meta
      property="og:description"
      content="An AI companion for the one question budget apps never answer: can I afford this, right now? It reasons over your real income, commitments and goals."
    />
    <meta property="og:image" content="https://ritikadas.in/assets/og/savio-og.jpg?v=2" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta
      property="og:image:alt"
      content="Savio — an AI money companion, shown answering whether a purchase is affordable."
    />

    <meta name="twitter:title" content="Savio" />

      name="twitter:description"
