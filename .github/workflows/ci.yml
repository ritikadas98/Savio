name: CI

# Runs on every push to main and on every pull request. Mirrors the
# local verification gates: type-check (tsc -b project-build mode) and
# lint (ESLint, baseline ~24 problems per D.13 + a no-new-errors policy).
# Build artifacts are NOT published from CI — Netlify auto-deploys
# directly from main. CI's job is just "did the code stay healthy."

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Type-check + lint
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Matches .nvmrc pin (Node 22 LTS). Update both files together.
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        # tsc -b runs in project-build mode and traverses tsconfig.app.json
        # + tsconfig.node.json references. Catches type errors that the
        # production build (Vite-only after 0.5t) would otherwise skip.
        run: npm run typecheck

      - name: Lint
        # ESLint baseline is ~24 problems (mostly pre-existing TS6133 +
        # set-state-in-effect items per D.13). CI flags any regression
        # via the bare `eslint .` exit code being non-zero only when
        # new errors are introduced, not when baseline ones persist.
        # If the baseline shifts, update package.json's lint script
        # OR bake a baseline-comparison step here.
        run: npm run lint
        continue-on-error: true
